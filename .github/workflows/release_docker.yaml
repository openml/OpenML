name: release-docker

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels) for Docker Hub
        id: meta_dockerhub
        uses: docker/metadata-action@v5
        with:
          images: "openml/php-rest-api"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}

      - name: Update repo description
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: openml/php-rest-api
          short-description: "PHP rest api for OpenML."
          readme-filepath: ./docker/README.md

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  update-services:

    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check out openml/services
        uses: actions/checkout@v4
        with:
          repository: openml/services
          token: ${{ secrets.SERVICES_PAT }}

      - name: Update php-rest-api image version in docker-compose.yaml
        run: |
          sed -i "s|image: openml/php-rest-api:.*|image: openml/php-rest-api:${{ steps.version.outputs.tag }}|" docker-compose.yaml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SERVICES_PAT }}
          commit-message: "Update php-rest-api to ${{ steps.version.outputs.tag }}"
          branch: "update-php-rest-api-${{ steps.version.outputs.tag }}"
          title: "Update php-rest-api to ${{ steps.version.outputs.tag }}"
          body: |
            Automated update of the `openml/php-rest-api` Docker image
            to version `${{ steps.version.outputs.tag }}`, triggered by
            a new tag push in [openml/OpenML](https://github.com/openml/OpenML).
          base: main
